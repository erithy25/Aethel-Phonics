[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aethel-apld-mps"
version = "0.1.0"
description = "APLD-MPS: Integrated IDE and simulation platform for exciton-polariton-based logic gates and waveguide structures at room temperature"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "mypy>=1.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
